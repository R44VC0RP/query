<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>query: README header</title>
<!-- README header in the style of an Apollo Operations Handbook drawing, dark. Render to ../header.png:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
       --allow-file-access-from-files --virtual-time-budget=4000 --window-size=816,329 \
       --hide-scrollbars --force-device-scale-factor=2 --screenshot="$PWD/../header.png" "file://$PWD/header.html" -->
<style>
  @font-face { font-family: "Routed Gothic"; src: url("fonts/routed-gothic.ttf"); }
  @font-face { font-family: "Routed Gothic Narrow"; src: url("fonts/routed-gothic-narrow.ttf"); }

  * { box-sizing: border-box; }
  :root {
    --ink: #e6e3da;
    --paper: #0e0e0d;
    --type: "Iowan Old Style", "Iowan", Georgia, serif;
    --leroy: "Routed Gothic Narrow", "Routed Gothic", sans-serif;
  }
  html, body { margin: 0; padding: 0; background: var(--paper); }

  .page {
    width: 216mm;
    height: 87mm;
    padding: 9mm 15mm 0 16mm;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--type);
    overflow: hidden;
  }

  .head { text-align: center; font-size: 8.6pt; font-weight: 700; letter-spacing: 0.12em; }
  .rule { border-top: 1.5pt solid var(--ink); margin: 1.6mm -2mm 0; }

  figure { margin: 5mm 0 0; }
  figure svg { display: block; width: 100%; height: auto; }

  svg text { font-family: var(--leroy); fill: var(--ink); letter-spacing: 0.04px; }
  svg .w    { fill: none; stroke: var(--ink); stroke-width: 0.3; stroke-linejoin: round; }
  svg .wa   { fill: none; stroke: var(--ink); stroke-width: 0.3; stroke-linejoin: round; marker-end: url(#nh-arrow); }
  svg .box  { fill: var(--paper); stroke: var(--ink); stroke-width: 0.45; }
  svg .panel{ fill: none; stroke: var(--ink); stroke-width: 0.3; stroke-dasharray: 2 1; }
  svg .dot  { fill: var(--ink); }
  svg .lbl   { font-size: 2.35px; }
  svg .lbl-s { font-size: 2.05px; }
  svg .lbl-b { font-size: 2.5px; font-family: "Routed Gothic", sans-serif; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="nh-arrow" viewBox="0 0 6 4" refX="5.6" refY="2" markerWidth="2.4" markerHeight="1.3" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="none"><path d="M0,0 L6,2 L0,4 Z" fill="#e6e3da"/></marker>
  </defs>
</svg>

<div class="page">
  <header class="head">
    QUERY &nbsp;&middot;&nbsp; SECURE VALUE REQUEST SYSTEM
    <div class="rule"></div>
  </header>

  <figure>
    <svg viewBox="0 0 184 55" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A coding agent calls query, a floating prompt on the person's display collects the values, and they go to a command, a dotenv file or stdout.">
      <!-- the person's display -->
      <rect class="panel" x="62" y="1.5" width="60" height="19"/>
      <text class="lbl-s" x="64" y="4.6">PERSON'S DISPLAY</text>
      <rect class="box" x="72" y="7" width="40" height="9"/>
      <text class="lbl" x="92" y="12.4" text-anchor="middle">FLOATING PROMPT</text>

      <!-- agent to query -->
      <rect class="box" x="6" y="33" width="36" height="9"/>
      <text class="lbl" x="24" y="38.4" text-anchor="middle">CODING AGENT</text>
      <line class="wa" x1="42" y1="37.5" x2="76.6" y2="37.5"/>
      <text class="lbl-s" x="46" y="36.3">QUERY RUN KEY -- CMD</text>

      <rect class="box" x="77" y="33" width="30" height="9"/>
      <text class="lbl-b" x="92" y="38.5" text-anchor="middle">QUERY</text>

      <line class="wa" x1="86" y1="33" x2="86" y2="16.4"/>
      <text class="lbl-s" x="84.4" y="26" text-anchor="end">KEY NAMES</text>
      <line class="wa" x1="98" y1="16" x2="98" y2="32.6"/>
      <text class="lbl-s" x="99.6" y="26">VALUES</text>

      <!-- outputs -->
      <line class="w" x1="107" y1="37.5" x2="122" y2="37.5"/>
      <line class="w" x1="122" y1="25.5" x2="122" y2="49.5"/>
      <circle class="dot" cx="122" cy="37.5" r="0.55"/>

      <line class="wa" x1="122" y1="25.5" x2="133.6" y2="25.5"/>
      <text class="lbl-s" x="124.4" y="24.4">RUN</text>
      <rect class="box" x="134" y="21.5" width="44" height="8"/>
      <text class="lbl" x="156" y="26.4" text-anchor="middle">COMMAND</text>

      <line class="wa" x1="122" y1="37.5" x2="133.6" y2="37.5"/>
      <text class="lbl-s" x="124.4" y="36.4">WRITE</text>
      <rect class="box" x="134" y="33.5" width="44" height="8"/>
      <text class="lbl" x="156" y="38.4" text-anchor="middle">.ENV FILE</text>

      <line class="wa" x1="122" y1="49.5" x2="133.6" y2="49.5"/>
      <text class="lbl-s" x="124.4" y="48.4">GET</text>
      <rect class="box" x="134" y="45.5" width="44" height="8"/>
      <text class="lbl" x="156" y="50.4" text-anchor="middle">STDOUT</text>
    </svg>
  </figure>
</div>
</body>
</html>
